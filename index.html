<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula Momentum - Evaluación</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: black; color: white; margin: 0; font-family: sans-serif; }
        .neu-card { background: #0a0a0a; border: 1px solid #1a1a1a; box-shadow: 10px 10px 20px #050505; }
        .animate-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .text-yellow { color: #eab308; }
        .bg-yellow { background-color: #eab308; }
        .disabled-btn { opacity: 0.1; cursor: not-allowed; pointer-events: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const App = () => {
            const [currentStep, setCurrentStep] = useState(0);
            const [answers, setAnswers] = useState({});
            const [nombre, setNombre] = useState('');
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [sending, setSending] = useState(false);

            const scriptURL = 'TU_URL_DE_GOOGLE_SCRIPT_AQUÍ';

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'instant' });
            };

            const questions = useMemo(() => [
                // BLOQUE 1
                { id: 1, cat:"Mentalidad", q:"¿Qué tanto te incomoda tu situación actual (1-10)?", opts: [{ t:"1-3: Cómodo", s: 1}, { t: "4-6: Podría mejorar", s: 4}, { t:"7-8: Cambio urgente", s:7 },{ t:"9-10: Innegociable", s:10 }]},
                { id: 2, cat:"Resiliencia", q:"¿Ajustas la estrategia si no hay resultados?", opts:[ { t:"Abandono", s:1 },{ t:"Cuestiono", s:4 }, { t:"Ajusto", s:7 },{ t:"Persisto", s:10 }]},
                { id: 3, cat:"Compromiso", q:"¿Qué prioridad tiene este avance hoy?", opts: [ { t:"Pasatiempo", s:2 },{ t:"Si hay tiempo", s:5 }, { t:"Secundaria", s:8 },{ t:"Eje central", s: 10}]},
                { id: 4, cat:"Estrategia", q:"¿Ves obstáculos como errores o como datos?", opts: [ { t:"Errores", s:2 },{ t:"Frustración", s:4 }, { t:"Inseguridad", s:7 },{ t:"Datos puros", s:10 }]},
                { id: 5, cat:"Sostenibilidad", q:"¿Tiempo dispuesto a invertir antes del retorno?", opts: [ { t:"15 días", s:1 },{ t:"2 meses", s:4 }, { t:"6 meses", s:7 },{ t:"Indefinido", s: 10}]},
                // (Debes incluir aquí las 40 preguntas completas con sus 4 opciones cada una)
            ], []);

            const questionsToShow = questions.slice(currentStep * 5, (currentStep + 1) * 5);
            
            // Validación: ¿Están todas las preguntas del bloque actual respondidas?
            const isBlockComplete = questionsToShow.every(q => answers[q.id] !== undefined);

            const handleNext = () => {
                if(isBlockComplete) {
                    setCurrentStep(prev => prev + 1);
                    setTimeout(scrollToTop, 10);
                }
            };

            const handleSubmit = async () => {
                setSending(true);
                const resumen = Object.keys(answers).map(id => `P${id}:${answers[id]}`).join(" | ");
                const data = { nombre, email, fecha: new Date().toLocaleString(), resultado: resumen };
                try {
                    await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                    setSubmitted(true);
                    setTimeout(scrollToTop, 10);
                } catch (e) { console.error(e); }
                setSending(false);
            };

            if (submitted) {
                return (
                    <div className="min-h-screen bg-black text-white p-6 md:p-20 flex flex-col items-center animate-in text-left">
                        <header className="mb-12 text-center">
                            <h1 className="text-4xl md:text-6xl font-black italic uppercase">FÓRMULA.<span className="text-yellow">MOMENTUM</span></h1>
                        </header>
                        <div className="max-w-4xl w-full p-10 rounded-[40px] neu-card border border-yellow/20 space-y-8">
                            <h2 className="text-2xl md:text-3xl font-bold text-yellow uppercase italic text-center leading-tight">Tus resultados fueron enviados correctamente.</h2>
                            <div className="space-y-6 text-slate-300 text-lg leading-relaxed">
                                <p>Completar este formulario no garantiza nada. Solo marca el punto en el que algunas personas deciden dejar de improvisar y empezar a construir con criterio.</p>
                                <p>Los resultados consistentes no aparecen por motivación ni por promesas atractivas. Se desarrollan cuando hay una ESTRUCTURA, un PROCESO claro y acciones que pueden MEDIRSE y COMPROBARSE en el tiempo.</p>
                                <p>En breve vas a recibir un email con el ESTADO y NIVEL DE APROBACIÓN de tu solicitud al correo aportado.</p>
                                <p>Si cumplís con los requisitos, vas a poder acceder a un proyecto diseñado para trabajar sobre esa base: método, ejecución y lectura constante de resultados. Acá el avance depende de DECISIÓN, VOLUNTAD y RESILIENCIA.</p>
                                <p>Por eso son pocos los que llegan lejos: sostener el proceso cuando deja de ser cómodo es lo que separa a los que avanzan de los que se quedan en intención.</p>
                                <div className="pt-10 border-t border-white/10 text-center">
                                    <h3 className="text-4xl md:text-6xl font-black italic leading-none">
                                        LOS RESULTADOS EXTRAORDINARIOS <br/>
                                        <span className="text-yellow">SE CONSTRUYEN, NO SE ESPERAN.</span>
                                    </h3>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-black text-white p-6 md:p-12">
                    <div className="max-w-4xl mx-auto">
                        <header className="text-center mb-16">
                            <h1 className="text-4xl md:text-5xl font-black italic tracking-tighter uppercase mb-10">FÓRMULA.<span className="text-yellow">MOMENTUM</span></h1>
                            {currentStep === 0 && (
                                <div className="text-left space-y-6 text-slate-300 text-lg md:text-xl p-10 rounded-[40px] neu-card border-l-4 border-yellow animate-in leading-relaxed">
                                    <p>La fórmula Momentum no está pensada para todos los momentos ni para todas las personas — se apoya en lo que realmente sostiene los resultados: <span className="text-white font-bold italic">HAMBRE POR AVANZAR, RESILIENCIA FRENTE A LOS OBSTÁCULOS y COMPROMISO REAL PARA LLEVAR UN PROCESO HASTA EL FINAL.</span></p>
                                    <p>Acá no se improvisa ni se persiguen efectos inmediatos. El avance se construye a partir de ESTRATEGIA que define el enfoque, PROCESO que ordena la ejecución y AJUSTE CONTINUO que convierte la experiencia en mejora real.</p>
                                    <p>El único riesgo en esta inversión no es equivocarse ni avanzar más lento de lo esperado — es INTERRUMPIR EL PROCESO antes de comprender cómo se alinean las acciones y los resultados. Cuando esa comprensión aparece, los resultados dejan de ser circunstanciales. Se vuelven PREVISIBLES, SOSTENIBLES y dependientes del criterio de quien ejecuta.</p>
                                    <p className="text-white font-bold pt-4">Por eso, lo que sigue no es una promesa ni una inscripción automática — es una EVALUACIÓN HONESTA para que puedas UBICARTE CON CLARIDAD, reconocer en qué punto estás hoy y decidir, con CRITERIO PROFESIONAL, si la fórmula Momentum es el proceso adecuado para este momento de tu recorrido.</p>
                                </div>
                            )}
                        </header>

                        <div className="space-y-8">
                            {questionsToShow.map(q => (
                                <div key={q.id} className="p-8 md:p-10 rounded-[40px] neu-card animate-in border border-white/5">
                                    <h3 className="text-xl md:text-2xl font-bold mb-8">{q.q}</h3>
                                    <div className="grid gap-4">
                                        {q.opts.map((o, i) => (
                                            <button 
                                                key={i} 
                                                onClick={() => setAnswers({...answers, [q.id]: o.s})} 
                                                className={`p-6 rounded-2xl text-left border transition-all duration-200 ${
                                                    answers[q.id] === o.s 
                                                    ? 'bg-yellow text-black border-yellow font-black' 
                                                    : 'bg-transparent border-white/10 text-slate-400 hover:border-white/30'
                                                }`}
                                            >
                                                {o.t}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {currentStep === 7 && (
                            <div className="mt-12 p-8 md:p-12 rounded-[50px] neu-card border border-yellow/20 text-center space-y-6 animate-in">
                                <h3 className="text-2xl font-black italic uppercase text-yellow">Finalizar Envío</h3>
                                <input type="text" placeholder="Nombre completo" value={nombre} onChange={e => setNombre(e.target.value)} className="w-full p-5 rounded-2xl bg-black border border-white/10 text-white outline-none focus:border-yellow" />
                                <input type="email" placeholder="Email principal" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-5 rounded-2xl bg-black border border-white/10 text-white outline-none focus:border-yellow" />
                                <button 
                                    onClick={handleSubmit} 
                                    disabled={sending || !nombre || !email} 
                                    className="w-full p-8 rounded-3xl bg-yellow text-black font-black text-2xl uppercase italic hover:scale-[1.01] active:scale-95 transition-all"
                                >
                                    {sending ? 'ENVIANDO...' : 'ENVIAR EVALUACIÓN'}
                                </button>
                            </div>
                        )}

                        <div className="flex justify-between items-center mt-12 mb-24">
                            <button 
                                onClick={() => {setCurrentStep(s => s - 1); setTimeout(scrollToTop, 10);}} 
                                disabled={currentStep === 0} 
                                className={`px-10 py-5 rounded-2xl font-black uppercase text-xs ${currentStep === 0 ? 'invisible' : 'neu-card text-slate-400 hover:text-white transition-colors'}`}
                            >
                                Atrás
                            </button>
                            <span className="text-[10px] font-black text-slate-700 uppercase tracking-widest text-center">Bloque {currentStep + 1} de 8</span>
                            {currentStep < 7 && (
                                <button 
                                    onClick={handleNext} 
                                    className={`px-10 py-5 rounded-2xl font-black uppercase text-xs transition-all ${
                                        !isBlockComplete 
                                        ? 'disabled-btn bg-white/5 text-white/20' 
                                        : 'bg-white text-black hover:bg-yellow'
                                    }`}
                                >
                                    Siguiente
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
