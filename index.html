<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula Momentum - Evaluación</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: black; color: white; margin: 0; font-family: 'Inter', sans-serif; }
        .neu-card { background: #0a0a0a; border: 1px solid #1a1a1a; box-shadow: 15px 15px 30px #050505; }
        .text-yellow { color: #eab308; }
        .border-yellow { border-color: #eab308; }
        .animate-fade { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .line-height-relaxed { line-height: 1.8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            const [currentStep, setCurrentStep] = useState(0);
            const [answers, setAnswers] = useState({});
            const [nombre, setNombre] = useState('');
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [sending, setSending] = useState(false);

            const scriptURL = 'TU_URL_DE_GOOGLE_SCRIPT_AQUÍ';

            const scrollToTop = () => {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
            };

            // Estructura de preguntas (Aquí van tus 40 preguntas)
            const questions = useMemo(() => [
                { id: 1, cat:"Hambre de Avanzar", q:"¿Qué tanto te incomoda tu situación actual (1-10)?", opts: [{ t:"1-3: Cómodo", s: 1}, { t: "4-6: Podría mejorar", s: 4}, { t:"7-8: Necesito un cambio", s:7 },{ t:"9-10: Innegociable", s:10 }]},
                { id: 2, cat:"Resiliencia", q:"¿Ajustas la estrategia si no hay resultados inmediatos?", opts:[ { t:"Abandono", s:1 },{ t:"Cuestiono", s:4 }, { t:"Ajusto con dudas", s:7 },{ t:"Acepto el ajuste", s:10 }]},
                { id: 3, cat:"Compromiso", q:"¿Qué prioridad tiene este avance hoy?", opts: [ { t:"Pasatiempo", s:2 },{ t:"Si hay tiempo", s:5 }, { t:"Secundaria", s:8 },{ t:"Eje central", s: 10}]},
                { id: 4, cat:"Estrategia", q:"¿Ves obstáculos como errores o como datos?", opts: [ { t:"Errores", s:2 },{ t:"Frustración", s:4 }, { t:"Inseguridad", s:7 },{ t:"Datos puros", s:10 }]},
                { id: 5, cat:"Sostenibilidad", q:"¿Tiempo dispuesto a invertir antes del retorno?", opts: [ { t:"15 días", s:1 },{ t:"2 meses", s:4 }, { t:"6 meses", s:7 },{ t:"El que sea necesario", s: 10}]}
                // ... replicar para completar las 40 preguntas
            ], []);

            const handleSubmit = async () => {
                if (!nombre || !email) return;
                setSending(true);
                const resumen = Object.keys(answers).map(id => `P${id}:${answers[id]}`).join(" | ");
                const data = { nombre, email, fecha: new Date().toLocaleString(), resultado: resumen };

                try {
                    await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                    setSubmitted(true);
                    setTimeout(scrollToTop, 50);
                } catch (e) { console.error(e); }
                setSending(false);
            };

            // 1. PANTALLA DE ÉXITO (POST-ENVÍO)
            if (submitted) {
                return (
                    <div className="min-h-screen bg-black text-white p-6 md:p-20 flex flex-col items-center animate-fade">
                        <header className="mb-12 text-center">
                            <h1 className="text-5xl md:text-8xl font-black italic tracking-tighter uppercase">
                                FÓRMULA.<span className="text-yellow">MOMENTUM</span>
                            </h1>
                        </header>

                        <div className="max-w-4xl w-full p-8 md:p-16 rounded-[50px] neu-card border border-yellow/20 space-y-10">
                            <h2 className="text-2xl md:text-4xl font-bold text-yellow uppercase italic text-center tracking-tight">
                                Tus resultados fueron enviados correctamente.
                            </h2>

                            <div className="space-y-8 text-slate-300 text-lg md:text-xl leading-relaxed">
                                <p>Completar este formulario no garantiza nada.</p>
                                <p>Solo marca el punto en el que algunas personas deciden dejar de improvisar y empezar a construir con <span className="text-white font-bold italic">criterio</span>.</p>
                                <p>Los resultados consistentes no aparecen por motivación ni por promesas atractivas.</p>
                                
                                <div className="bg-yellow/5 p-8 rounded-3xl border border-yellow/20">
                                    <p className="text-white font-medium italic">
                                        Se desarrollan cuando hay una <span className="text-yellow font-black uppercase tracking-widest">ESTRUCTURA</span>, un <span className="text-yellow font-black uppercase tracking-widest">PROCESO</span> claro y acciones que pueden <span className="underline decoration-yellow decoration-2 underline-offset-4">MEDIRSE y COMPROBARSE</span> en el tiempo.
                                    </p>
                                </div>

                                <p>En breve vas a recibir un email con el <span className="text-white font-black">ESTADO y NIVEL DE APROBACIÓN</span> de tu solicitud.</p>
                                <p>Si cumplís con los requisitos, vas a poder acceder a un proyecto diseñado para trabajar sobre esa base: método, ejecución y lectura constante de resultados.</p>
                                <p className="text-white font-bold italic">Acá el avance depende de <span className="text-yellow font-black">DECISIÓN, VOLUNTAD y RESILIENCIA</span>.</p>
                                
                                <p className="text-slate-500 text-base italic border-l-2 border-slate-800 pl-6">
                                    Por eso son pocos los que llegan lejos: sostener el proceso cuando deja de ser cómodo es lo que separa a los que avanzan de los que se quedan en intención.
                                </p>

                                <div className="pt-12 border-t border-white/10 text-center">
                                    <p className="text-sm uppercase tracking-[0.4em] text-slate-500 mb-6">Si estás acá, es porque aceptás una verdad simple:</p>
                                    <h3 className="text-4xl md:text-6xl font-black italic text-white flex flex-col gap-2 leading-none">
                                        <span>LOS RESULTADOS EXTRAORDINARIOS</span>
                                        <span className="text-yellow">SE CONSTRUYEN,</span>
                                        <span>NO SE ESPERAN.</span>
                                    </h3>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // 2. PANTALLA PRINCIPAL (CUESTIONARIO)
            const currentQuestions = questions.slice(currentStep * 5, (currentStep + 1) * 5);

            return (
                <div className="min-h-screen bg-black text-white p-6 md:p-12">
                    <div className="max-w-4xl mx-auto">
                        <header className="text-center mb-16 animate-fade">
                            <h1 className="text-6xl md:text-9xl font-black italic tracking-tighter mb-8 leading-none">
                                FÓRMULA.<span className="text-yellow">MOMENTUM</span>
                            </h1>
                            
                            {/* DESCRIPCIÓN SOLICITADA ABAJO DEL LOGO */}
                            <div className="text-left space-y-6 text-slate-300 text-lg md:text-xl line-height-relaxed p-8 rounded-[40px] neu-card border-l-4 border-yellow">
                                <p>La fórmula Momentum no está pensada para todos los momentos ni para todas las personas — se apoya en lo que realmente sostiene los resultados: <span className="text-white font-bold italic">HAMBRE POR AVANZAR, RESILIENCIA FRENTE A LOS OBSTÁCULOS y COMPROMISO REAL PARA LLEVAR UN PROCESO HASTA EL FINAL.</span></p>
                                <p>Acá no se improvisa ni se persiguen efectos inmediatos. El avance se construye a partir de <span className="text-white font-bold">ESTRATEGIA</span> que define el enfoque, <span className="text-white font-bold uppercase">PROCESO</span> que ordena la ejecución y <span className="text-white font-bold">AJUSTE CONTINUO</span> que convierte la experiencia en mejora real.</p>
                                <p>El único riesgo en esta inversión no es equivocarse ni avanzar más lento de lo esperado — es <span className="text-yellow font-bold underline">INTERRUMPIR EL PROCESO</span> antes de comprender cómo se alinean las acciones y los resultados. Cuando esa comprensión aparece, los resultados dejan de ser circunstanciales. Se vuelven PREVISIBLES, SOSTENIBLES y dependientes del criterio de quien ejecuta.</p>
                                <p className="text-white font-bold pt-4 border-t border-white/5 uppercase tracking-tighter text-2xl">
                                    Por eso, lo que sigue no es una promesa ni una inscripción automática — es una EVALUACIÓN HONESTA para que puedas UBICARTE CON CLARIDAD, reconocer en qué punto estás hoy y decidir, con CRITERIO PROFESIONAL, si la fórmula Momentum es el proceso adecuado para este momento de tu recorrido.
                                </p>
                            </div>
                        </header>

                        {/* BLOQUES DE PREGUNTAS */}
                        <div className="space-y-8 animate-fade">
                            {currentQuestions.map(q => (
                                <div key={q.id} className="p-8 md:p-12 rounded-[40px] neu-card border border-white/5">
                                    <span className="text-yellow text-[10px] font-black uppercase tracking-[0.4em] mb-2 block">{q.cat}</span>
                                    <h3 className="text-2xl md:text-3xl font-bold mb-8 leading-tight">{q.q}</h3>
                                    <div className="grid gap-4">
                                        {q.opts.map((o, i) => (
                                            <button key={i} onClick={() => setAnswers({...answers, [q.id]: o.s})} 
                                                className={`p-6 rounded-2xl text-left border transition-all duration-300 text-lg ${answers[q.id] === o.s ? 'bg-yellow text-black border-yellow font-black scale-[1.02]' : 'bg-transparent border-white/10 text-slate-500 hover:border-white/30 hover:text-white'}`}>
                                                {o.t}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* FORMULARIO DE ENVÍO FINAL */}
                        {currentStep === Math.ceil(questions.length / 5) - 1 && (
                            <div className="mt-16 p-8 md:p-16 rounded-[50px] neu-card border border-yellow/20 text-center space-y-8 animate-fade">
                                <h3 className="text-3xl font-black italic uppercase tracking-tighter text-white">DATOS PARA NOTIFICACIÓN</h3>
                                <div className="space-y-4">
                                    <input type="text" placeholder="Nombre completo" value={nombre} onChange={e => setNombre(e.target.value)} className="w-full p-6 rounded-2xl bg-black border border-white/10 text-white outline-none focus:border-yellow transition-all font-bold text-lg" />
                                    <input type="email" placeholder="Email principal" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-6 rounded-2xl bg-black border border-white/10 text-white outline-none focus:border-yellow transition-all font-bold text-lg" />
                                </div>
                                <button onClick={handleSubmit} disabled={sending || !nombre || !email} className="w-full p-8 rounded-[30px] bg-yellow text-black font-black text-2xl uppercase italic shadow-[0_20px_40px_rgba(234,179,8,0.2)] hover:scale-[1.02] active:scale-95 transition-all">
                                    {sending ? 'TRANSMITIENDO...' : 'ENVIAR EVALUACIÓN'}
                                </button>
                            </div>
                        )}

                        {/* NAVEGACIÓN BLOQUES */}
                        <div className="flex justify-between items-center mt-12 mb-24 animate-fade">
                            <button onClick={() => {setCurrentStep(s => s - 1); setTimeout(scrollToTop, 20);}} disabled={currentStep === 0} className={`px-10 py-5 rounded-2xl font-black uppercase text-xs tracking-widest transition-all ${currentStep === 0 ? 'invisible' : 'neu-card text-slate-500 hover:text-white'}`}>Atrás</button>
                            <span className="text-[10px] font-black text-slate-700 uppercase tracking-[0.5em]">BLOQUE {currentStep + 1} DE 8</span>
                            {currentStep < 7 ? (
                                <button onClick={() => {setCurrentStep(s => s + 1); setTimeout(scrollToTop, 20);}} className="px-10 py-5 rounded-2xl bg-white text-black font-black uppercase text-xs tracking-widest hover:bg-yellow transition-colors">Siguiente</button>
                            ) : <div className="w-32"></div>}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
