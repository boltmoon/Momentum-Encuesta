<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula Momentum - Evaluación</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        const ShieldCheck = () => <i data-lucide="shield-check"></i>;
        const Send = () => <i data-lucide="send"></i>;
        const Compass = () => <i data-lucide="compass"></i>;
        const Activity = () => <i data-lucide="activity"></i>;
        const ChevronRight = () => <i data-lucide="chevron-right"></i>;
        const ChevronLeft = () => <i data-lucide="chevron-left"></i>;
        const CircleDot = () => <i data-lucide="circle-dot"></i>;
        const User = () => <i data-lucide="user"></i>;
        const Mail = () => <i data-lucide="mail"></i>;

        const App = () => {
            const [answers, setAnswers] = useState({});
            const [nombre, setNombre] = useState('');
            const [email, setEmail] = useState('');
            const [sending, setSending] = useState(false);
            const [submitted, setSubmitted] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);

            useEffect(() => { lucide.createIcons(); });

            const questions = useMemo(() => [
                { id: 1, cat:"Hambre de Avanzar", ref:"Deseo y Ambición", q:"¿Qué tanto te incomoda tu situación actual en una escala del 1 al 10?", opts: [{ t:"1-3: Estoy cómodo, solo busco curiosidad", s: 1}, { t: "4-6: Podría mejorar, pero no es vital", s: 4}, { t:"7-8: Necesito un cambio real pronto", s:7 },{ t:"9-10: Es innegociable avanzar hoy mismo", s:10 }]},
                { id: 2, cat:"Resiliencia", ref:"Gestión de Crisis", q:"Si el proceso requiere ajustar la estrategia tres veces antes del resultado, ¿qué haces?", opts:[ { t:"Abandono por falta de claridad", s:1 },{ t:"Cuestiono el proceso", s:4 }, { t:"Ajusto con dudas", s:7 },{ t:"Acepto el ajuste como parte del aprendizaje real", s:10 }]},
                { id: 3, cat:"Compromiso Real", ref:"Priorización", q:"¿Qué lugar ocupa este avance en tu lista de prioridades diarias?", opts: [ { t:"Es un pasatiempo", s:2 },{ t:"Lo hago si tengo tiempo libre", s:5 }, { t:"Es mi prioridad secundaria", s:8 },{ t:"Es el eje central de mi ejecución profesional", s: 10}]},
                { id: 4, cat:"Estrategia", ref:"Visión de Proceso", q:"¿Ves los obstáculos como errores del sistema o como datos para el ajuste?", opts: [ { t:"Los veo como errores personales", s:2 },{ t:"Me frustran y me detienen", s:4 }, { t:"Los analizo con inseguridad", s:7 },{ t:"Son datos puros para la mejora continua", s:10 }]},
                { id: 5, cat:"Hambre de Avanzar", ref:"Sostenibilidad", q:"¿Cuánto tiempo estás dispuesto a invertir antes de ver el primer gran retorno?", opts: [ { t:"Necesito resultados en 15 días", s:1 },{ t:"Máximo 2 meses", s:4 }, { t:"6 meses con resultados parciales", s:7 },{ t:"El tiempo que sea necesario para dominar el proceso", s: 10}]},
                { id: 6, cat:"Ajuste Continuo", ref:"Coachability", q:"Si el método exige cambiar un hábito que consideras 'correcto', ¿cuál es tu reacción?", opts:[ { t:"Mantengo mi forma de actuar", s:1 },{ t:"Lo cambio pero con resistencia", s:4 }, { t:"Pido explicaciones constantes", s:7 },{ t:"Ejecuto el cambio con confianza en el método", s: 10}]},
                { id: 7, cat:"Resiliencia", ref:"Inversión Emocional", q:"¿Cómo manejas la incertidumbre de un proceso que aún no comprendes del todo?", opts: [ { t:"Me genera ansiedad paralizante", s:2 },{ t:"Busco atajos inmediatos", s:4 }, { t:"Tolero la duda", s:8 },{ t:"Confío en que la comprensión vendrá con la acción", s: 10}]},
                { id: 8, cat:"Hambre de Avanzar", ref:"Sacrificio", q:"¿Qué estás dispuesto a sacrificar para que la Fórmula Momentum funcione?", opts: [ { t:"Solo mi tiempo de ocio", s:3 },{ t:"Mis fines de semana", s:5 }, { t:"Mi zona de confort habitual", s:8 },{ t:"Todo lo que no esté alineado con el resultado final", s: 10}]},
                { id: 9, cat:"Compromiso Real", ref:"Constancia", q:"¿Qué tan frecuente es que interrumpas un proceso antes de terminarlo?", opts: [ { t:"Muy frecuente, me distraigo", s:1 },{ t:"A veces, si se vuelve difícil", s:4 }, { t:"Rara vez, suelo terminar", s:7 },{ t:"Nunca interrumpo hasta que el resultado es previsible", s: 10}]},
                { id: 10, cat:"Visión", ref:"Criterio Profesional", q:"¿Buscas una promesa mágica o un sistema de trabajo previsible?", opts: [ { t:"Quiero un truco rápido", s:1 },{ t:"Busco facilidad de uso", s:4 }, { t:"Busco una guía", s:7 },{ t:"Busco un proceso profesional basado en resultados", s: 10}]},
                { id: 11, cat:"Proceso", ref:"Enfoque Operativo", q:"¿Confías más en tu intención o en una estrategia validada?", opts: [ { t:"100% intuición", s:2 },{ t:"Mezcla de ambos", s:5 },{ t:"Intuición informada", s:8 },{ t:"Estrategia validada", s:10 }]},
                { id: 12, cat:"Impacto", ref:"Determinación", q:"Ante la crítica de terceros sobre tu nuevo rumbo profesional, tú:", opts: [ { t:"Me retracto", s:1 },{ t:"Dudo de mi capacidad", s:4 },{ t:"Ignoro sin analizar", s:7 },{ t:"Uso la crítica como combustible", s:10 }]},
                { id: 13, cat:"Resiliencia", ref:"Capacidad de Respuesta", q:"Si el proceso toma el doble del tiempo planeado, ¿qué haces?", opts: [ { t:"Abandono", s:1 },{ t:"Reduzco calidad", s:3 },{ t:"Me frustro pero sigo", s:7 },{ t:"Ajusto y mantengo excelencia", s:10 }]},
                { id: 14, cat:"Criterio", ref:"Autocrítica", q:"¿Reconoces que tu forma actual no es suficiente para escalar?", opts: [ { t:"No, trabajo perfecto", s:1 },{ t:"Quizás falten detalles", s:4 },{ t:"Soy consciente", s:8 },{ t:"Sé que debo transformarme", s:10 }]},
                { id: 15, cat:"Momentum", ref:"Velocidad de Acción", q:"¿Cuánto tardas en pasar de una idea a la ejecución real?", opts: [ { t: "Semanas", s: 2 }, { t: "Días", s: 5 }, { t: "24 horas", s: 8 }, { t: "Inmediatamente", s: 10 }]},
                { id: 16, cat: "Proceso", ref:"Gestión de Datos", q:"¿Prefieres ocultar tus fallos o analizarlos frente a un experto?", opts: [ { t:"Ocultarlos", s:1 },{ t:"Mostrarlos solo si fallan mucho", s:4 },{ t:"Ser honesto a medias", s:7 },{ t:"Total transparencia", s:10 }]},
                { id: 17, cat:"Hambre", ref:"Obsesión por Mejora", q:"¿Qué tan obsesivo eres con los detalles que otros ignoran?", opts: [ { t:"Poco", s: 2}, { t: "Solo en lo estético", s: 5}, { t: "En lo técnico", s: 8}, { t: "En todo lo que impacta", s: 10}]},
                { id: 18, cat:"Sostenibilidad", ref:"Mentalidad", q:"¿Cómo visualizas tu recorrido en los próximos 18 meses?", opts: [ { t:"Sin visión clara", s:2 },{ t:"Esperando suerte", s:4 },{ t:"Metas vagas", s:7 },{ t:"Plan de avance continuo", s:10 }]},
                { id: 19, cat:"Compromiso", ref:"Responsabilidad", q:"Si los resultados no llegan, ¿dónde buscas la causa?", opts: [ { t:"Mercado externo", s:1 },{ t:"Mala suerte", s:3 },{ t:"La herramienta", s:6 },{ t:"Mi propia ejecución", s:10 }]},
                { id: 20, cat:"Ejecución", ref:"Inversión", q:"¿Invertirías tu último capital si el proceso es el correcto?", opts: [ { t:"No, miedo", s:2 },{ t:"Mínima parte", s:4 },{ t:"Lo dudaría mucho", s:7 },{ t:"Es obligatorio", s:10 }]},
                { id: 21, cat:"Criterio", ref:"Foco", q: "¿Dices NO a oportunidades rentables que te alejan de Momentum?", opts:[ { t:"Acepto todo", s:1 },{ t:"Me cuesta mucho", s:4 },{ t:"Cedo a veces", s:7 },{ t:"NO radical", s:10 }]},
                { id: 22, cat:"Energía", ref:"Capacidad", q:"¿Cuál es tu capacidad de trabajo enfocado sin distracciones?", opts: [ { t:"30 minutos", s:2 },{ t:"1-2 horas", s:5 },{ t:"4 horas", s:8 },{ t:"Deep Work total", s:10 }]},
                { id: 23, cat:"Determinación", ref:"Superación", q:"Frente a un 'No' de un prospecto, tú:", opts:[ { t:"Me deprimo", s:2 },{ t:"Busco culpables", s:4 },{ t:"Lo olvido", s:7 },{ t:"Es un paso más al Sí", s:10 }]},
                { id: 24, cat:"Impacto", ref:"Legacy", q:"¿Te importa más tu imagen o la transformación real?", opts: [ { t:"Imagen social", s:2 },{ t:"Equilibrio", s:5 },{ t:"Éxito financiero", s:7 },{ t:"Transformación real", s:10 }]},
                { id: 25, cat:"Disciplina", ref:"Ritmo", q:"¿Mantienes un ritmo aburrido pero efectivo por meses?", opts: [ { t:"Necesito novedad", s:2 },{ t:"Me cuesta", s:5 },{ t:"Lo intento", s:7 },{ t:"La consistencia manda", s:10 }]},
                { id: 26, cat:"Visión", ref:"Mentoría", q:"¿Qué valor le das al acompañamiento experto?", opts: [ { t:"Gasto innecesario", s:1 },{ t:"Solo si es barato", s:4 },{ t:"Es útil", s:7 },{ t:"Acelerador esencial", s:10 }]},
                { id: 27, cat:"Ajuste", ref:"Humildad", q:"¿Aceptas que tu conocimiento actual tiene un techo?", opts: [ { t:"Lo sé todo", s:1 },{ t:"Me cuesta aprender", s:4 },{ t:"Sé que me falta", s:7 },{ t:"Hambre de aprender", s:10 }]},
                { id: 28, cat:"Sostenibilidad", ref:"Legado", q:"¿Prefieres un resultado hoy o una máquina de resultados?", opts: [ { t:"Dinero de hoy", s:3 },{ t:"Lo rápido", s:5 },{ t:"Un mix", s:8 },{ t:"Sistema previsible", s:10 }]},
                { id: 29, cat:"Compromiso", ref:"Resolución", q:"Ante una tarea técnica difícil, ¿qué haces?", opts: [ { t:"Lo pospongo", s:2 },{ t:"Busco gratis", s:4 },{ t:"A medias", s:7 },{ t:"Resuelvo con los mejores", s:10 }]},
                { id: 30, cat:"Resiliencia", ref:"Fuerza Mental", q:"¿Cómo reaccionas cuando nada sale según el plan?", opts: [ { t: "Pánico", s: 2 }, { t: "Queja", s: 4 }, { t: "Me detengo", s: 7 }, { t: "Ajusto y sigo", s: 10 }]},
                { id: 31, cat: "Criterio", ref:"Autoridad", q:"¿Cómo cuidas tu comunicación digital?", opts:[ { t:"No importa", s:2 },{ t:"Rápido", s:5 },{ t:"Lo básico", s:8 },{ t:"Alineada con mi autoridad", s:10 }]},
                { id: 32, cat:"Mentalidad", ref:"Progresión", q:"¿Te comparas con otros o contigo mismo ayer?", opts: [ { t:"Referentes", s:2 },{ t:"Amigos", s:4 },{ t:"Competencia", s:7 },{ t:"Mi ejecución de ayer", s:10 }]},
                { id: 33, cat:"Ambición", ref:"Nivel", q:"¿Cuál es tu hambre por alcanzar el siguiente nivel?", opts: [ { t: "Bajo", s: 2 }, { t: "Medio", s: 5 }, { t: "Alto", s: 8 }, { t: "Absoluto", s: 10 }]},
                { id: 34, cat: "Consistencia", ref:"Foco Diario", q:"¿Qué haces cada día para avanzar?", opts:[ { t: "Lo que surge", s:2 }, { t: "Emails", s: 4 }, { t: "Operativa", s: 7 }, { t: "Tarea de mayor impacto", s:10 }]},
                { id: 35, cat: "Evaluación", ref:"Honestidad", q:"¿Qué tan honesto eres sobre tus debilidades?", opts: [ { t:"Me miento", s:2 },{ t:"Autocrítico duro", s:5 },{ t:"Objetivo", s:8 },{ t:"Las afronto", s:10 }]},
                { id: 36, cat:"Momentum", ref:"Inercia", q:"Una vez que empiezas algo, ¿qué tan difícil es detenerte?", opts: [ { t: "Fácil", s: 2 }, { t: "Depende", s: 5 }, { t: "Suelo seguir", s: 8 }, { t: "Soy imparable", s: 10 }]},
                { id: 37, cat: "Ajuste", ref: "Feedback", q: "¿Buscas críticas constructivas o solo halagos?", opts: [ { t: "Halagos", s: 1 }, { t: "Me molestan críticas", s:4 }, { t: "Las acepto", s: 7 }, { t: "Exijo feedback brutal", s:10 }]},
                { id: 38, cat: "Compromiso", ref:"Firma", q:"¿Firmarías hoy 2 años de trabajo duro por éxito seguro?", opts: [ { t:"Mucho tiempo", s:2 },{ t:"Tal vez uno", s:5 },{ t:"Con dudas", s:8 },{ t:"Sin dudar", s:10 }]},
                { id: 39, cat:"Hambre", ref:"Motivación", q:"¿Qué te mueve más: el miedo o el deseo de ganar?", opts: [ { t:"Miedo", s:3 },{ t:"Necesidad", s:5 },{ t:"Deseo", s:8 },{ t:"La visión del legado", s:10 }]},
                { id: 40, cat:"Final", ref:"Decisión", q:"¿Estás listo para ubicarte con claridad y aceptar tu realidad?", opts: [ { t:"Tengo miedo", s:2 },{ t:"Veremos", s:5 },{ t:"Estoy preparado", s:8 },{ t:"Deseo la verdad", s:10 }]}
            ], []);

            const currentQuestions = useMemo(() => questions.slice(currentStep * 5, (currentStep + 1) * 5), [currentStep, questions]);
            const progress = (Object.keys(answers).length / 40) * 100;

            // ESTA ES LA CORRECCIÓN CLAVE: Verifica si las preguntas del bloque actual están respondidas
            const isStepComplete = useMemo(() => {
                return currentQuestions.every(q => answers[q.id] !== undefined);
            }, [answers, currentQuestions]);

            const handleSubmit = async () => {
                if (!nombre.trim() || !email.trim()) return;
                setSending(true);
                const scriptURL = 'https://script.google.com/macros/s/AKfycby8DbX4l6LIG7US8BoGGHWM4tdvUo-Q9kvR5-ZIxygVl3x7_EBtJvwta3i5aAGtwkC5/exec';
                const resumenRespuestas = Object.keys(answers).sort((a,b) => a-b).map(id => `P${id}: ${answers[id]}`).join(" | ");
                const dataToSend = { nombre, email, fecha: new Date().toLocaleString('es-AR'), resultado: resumenRespuestas };

                try {
                    await fetch(scriptURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dataToSend) });
                    setSubmitted(true);
                } catch (error) {
                    alert("Error al enviar los datos.");
                } finally {
                    setSending(false);
                }
            };

            const neuCard = "bg-[#0a0a0a] shadow-[10px_10px_20px_#050505,-10px_-10px_20px_#0f0f0f] border border-[#1a1a1a]";
            const neuInner = "shadow-[inset_4px_4px_8px_#050505,inset_-4px_-4px_8px_#0f0f0f]";

            if (submitted) {
                return (
                    <div className="min-h-screen bg-black flex items-center justify-center p-6 text-white font-sans">
                        <div className={`max-w-2xl w-full p-12 rounded-[40px] ${neuCard} text-center border-yellow-500/20`}>
                            <div className="w-24 h-24 bg-yellow-500 rounded-full flex items-center justify-center mx-auto mb-8 shadow-[0_0_30px_#eab308]">
                                <ShieldCheck />
                            </div>
                            <h1 className="text-4xl font-black mb-6 tracking-tighter italic uppercase">Análisis en Proceso</h1>
                            <p className="text-slate-400 mb-8 leading-relaxed text-lg">Gracias, <strong className="text-white">{nombre}</strong>. <br/>Tus datos han sido enviados. Recibirás tu evaluación pronto.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-black text-white p-4 md:p-12 font-sans selection:bg-yellow-500 selection:text-black">
                    <div className="max-w-4xl mx-auto">
                        <header className="text-center mb-16 relative">
                            <div className="inline-block p-6 rounded-3xl mb-8 relative">
                                <div className="absolute inset-0 bg-yellow-500/10 blur-3xl rounded-full"></div>
                                <h1 className="text-5xl md:text-7xl font-black tracking-tighter italic relative z-10 flex flex-col leading-none">
                                    <span className="text-white">fórmula.</span>
                                    <span className="text-yellow-500 -mt-2">momentum</span>
                                </h1>
                            </div>

                            <div className={`p-8 md:p-12 rounded-[32px] ${neuCard} text-left relative overflow-hidden group`}>
                                <div className="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
                                    <Compass />
                                </div>
                                <div className="max-w-3xl space-y-6 text-slate-300 leading-relaxed text-lg md:text-xl">
                                    <p>
                                        La <strong className="text-white">FÓRMULA MOMENTUM</strong> está concebida para <strong className="text-white">PROFESIONALES Y EMPRENDEDORES</strong> que comprenden que los resultados reales no dependen del momento ideal ni de fórmulas rápidas, sino de lo que verdaderamente los sostiene en el tiempo: <strong className="text-yellow-500">HAMBRE POR AVANZAR, RESILIENCIA FRENTE A LOS OBSTÁCULOS</strong> y <strong className="text-yellow-500">COMPROMISO REAL PARA LLEVAR UN PROCESO HASTA EL FINAL.</strong>
                                    </p>
                                    <p>
                                        En <strong className="text-white">MOMENTUM</strong> no se improvisa ni se persiguen efectos inmediatos. El avance se construye a partir de <strong className="text-white">ESTRATEGIA</strong>, que define el enfoque; <strong className="text-white">PROCESO</strong>, que ordena la ejecución; y <strong className="text-white">AJUSTE CONTINUO</strong>, que transforma la experiencia en mejora real.
                                    </p>
                                    <p>
                                        El único riesgo en esta inversión no es equivocarse ni avanzar más lento de lo esperado. El verdadero riesgo es <strong className="text-white">INTERRUMPIR EL PROCESO</strong> antes de comprender cómo se alinean las acciones con los resultados. Cuando esa comprensión aparece, los resultados dejan de ser circunstanciales: se vuelven <strong className="text-white">PREVISIBLES, SOSTENIBLES</strong> y dependen del <strong className="text-white">CRITERIO DE QUIEN EJECUTA.</strong>
                                    </p>
                                    <p className="bg-white/5 p-6 rounded-2xl border-l-4 border-yellow-500">
                                        Por eso, lo que sigue no es una promesa ni una inscripción automática. Es una <strong className="text-yellow-500">EVALUACIÓN HONESTA</strong>, pensada para que <strong className="text-white">PROFESIONALES Y EMPRENDEDORES</strong> puedan <strong className="text-white">UBICARSE CON CLARIDAD</strong>, reconocer en qué punto están hoy y decidir —con <strong className="text-white">CRITERIO PROFESIONAL</strong>— si la <strong className="text-white">FÓRMULA MOMENTUM</strong> es el proceso adecuado para este momento de su recorrido.
                                    </p>
                                </div>
                            </div>
                        </header>

                        <div className="mb-12">
                            <div className="flex justify-between items-end mb-4 px-4">
                                <div className="flex items-center gap-3">
                                    <Activity />
                                    <span className="text-xs font-black tracking-[0.3em] uppercase text-slate-500">Progreso de Evaluación</span>
                                </div>
                                <div className="text-right">
                                    <span className="text-3xl font-black italic text-yellow-500 leading-none">{Math.round(progress)}%</span>
                                </div>
                            </div>
                            <div className={`h-4 w-full rounded-full ${neuInner} p-1 bg-black overflow-hidden`}>
                                <div className="h-full bg-gradient-to-r from-yellow-600 via-yellow-400 to-white rounded-full transition-all duration-1000 ease-out shadow-[0_0_15px_#eab308]"
                                     style={{ width: `${progress}%` }}></div>
                            </div>
                        </div>

                        <div className="space-y-10">
                            {currentQuestions.map((q) => (
                                <div key={q.id} className={`p-8 md:p-10 rounded-[40px] ${neuCard} transition-all duration-500`}>
                                    <div className="flex flex-col md:flex-row gap-6">
                                        <div className="md:w-48 flex-shrink-0">
                                            <div className="text-[10px] font-black text-yellow-500 tracking-widest uppercase mb-1">{q.cat}</div>
                                            <div className="text-[9px] font-bold text-slate-600 uppercase mb-4 italic">Ref: {q.ref}</div>
                                            <div className={`w-12 h-12 rounded-2xl ${neuInner} flex items-center justify-center text-xl font-black italic border border-white/5`}>
                                                {q.id}
                                            </div>
                                        </div>
                                        <div className="flex-1">
                                            <h3 className="text-2xl md:text-3xl font-bold text-white mb-8 tracking-tight leading-tight">{q.q}</h3>
                                            <div className="grid grid-cols-1 gap-4">
                                                {q.opts.map((o, idx) => (
                                                    <button key={idx}
                                                            onClick={() => setAnswers(p => ({ ...p, [q.id]: o.s }))}
                                                            className={`group text-left p-6 rounded-3xl border transition-all duration-300 ${answers[q.id] === o.s ? 'bg-yellow-500 border-yellow-500 text-black' : 'bg-black border-[#222] text-slate-400 hover:border-yellow-500/50 hover:text-white'}`}>
                                                        <div className="flex items-center gap-4">
                                                            <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${answers[q.id] === o.s ? 'border-black' : 'border-slate-800'}`}>
                                                                {answers[q.id] === o.s && <div className="w-2 h-2 rounded-full bg-black"></div>}
                                                            </div>
                                                            <span className="text-lg font-bold italic">{o.t}</span>
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}

                            {currentStep === 7 && (
                                <div className={`p-10 md:p-16 rounded-[50px] ${neuCard} text-center space-y-10 animate-in fade-in`}>
                                    <h3 className="text-3xl md:text-4xl font-black italic text-white uppercase tracking-tighter mb-4">Finalizar Evaluación</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-left max-w-3xl mx-auto">
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-4 flex items-center gap-2"><User /> Nombre Completo</label>
                                            <input type="text" value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Ej: Juan Pérez" className={`w-full px-8 py-5 rounded-3xl ${neuInner} bg-black text-white outline-none border border-transparent focus:border-yellow-500/50`} />
                                        </div>
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-4 flex items-center gap-2"><Mail /> Email</label>
                                            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Ej: contacto@empresa.com" className={`w-full px-8 py-5 rounded-3xl ${neuInner} bg-black text-white outline-none border border-transparent focus:border-yellow-500/50`} />
                                        </div>
                                    </div>
                                    <button onClick={handleSubmit}
                                            disabled={!nombre.trim() || !email.includes('@') || sending || Object.keys(answers).length < 40}
                                            className={`px-16 py-8 rounded-[35px] font-black text-2xl italic transition-all ${nombre.trim() && email.includes('@') && !sending && Object.keys(answers).length === 40 ? 'bg-yellow-500 text-black hover:scale-105' : 'bg-slate-900 text-slate-700 opacity-50 cursor-not-allowed'}`}>
                                        {sending ? 'TRANSMITIENDO...' : 'ENVIAR EVALUACIÓN'}
                                    </button>
                                </div>
                            )}

                            <div className="flex flex-col md:flex-row items-center justify-between gap-8 pt-10 pb-20">
                                <button disabled={currentStep === 0} onClick={() => { setCurrentStep(s => s - 1); window.scrollTo(0, 0); }}
                                        className={`flex items-center gap-2 px-8 py-5 rounded-3xl font-black uppercase tracking-widest ${currentStep === 0 ? 'opacity-0 pointer-events-none' : `${neuCard} text-slate-400`}`}>
                                    <ChevronLeft /> Regresar
                                </button>
                                <div className="flex items-center gap-2">
                                    {[...Array(8)].map((_, i) => (
                                        <div key={i} className={`w-2 h-2 rounded-full transition-all ${currentStep === i ? 'bg-yellow-500 w-8' : 'bg-slate-800'}`}></div>
                                    ))}
                                </div>
                                {currentStep < 7 ? (
                                    <button disabled={!isStepComplete}
                                            onClick={() => { setCurrentStep(s => s + 1); window.scrollTo(0, 0); }}
                                            className={`flex items-center gap-3 px-10 py-5 rounded-3xl font-black uppercase tracking-widest transition-all ${!isStepComplete ? 'bg-slate-900 text-slate-700 opacity-50' : 'bg-white text-black hover:bg-yellow-500'}`}>
                                        Siguiente <ChevronRight />
                                    </button>
                                ) : <div className="w-48 invisible"></div>}
                            </div>
                        </div>

                        <footer className="text-center py-10 opacity-30">
                            <p className="text-slate-700 text-[10px] font-black tracking-[0.6em] uppercase">Fórmula Momentum ©2025</p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <style>
        input::placeholder { font-style: italic; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fade-in 0.6s ease-out forwards; }
        body { background-color: black; margin: 0; padding: 0; }
        [data-lucide] { width: 1.25rem; height: 1.25rem; }
    </style>
</body>
</html>
