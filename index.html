<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula Momentum - Evaluación</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: black; margin: 0; padding: 0; color: white; scroll-behavior: smooth; }
        .neu-card { background: #0a0a0a; border: 1px solid #1a1a1a; box-shadow: 10px 10px 20px #050505, -10px -10px 20px #0f0f0f; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            const [answers, setAnswers] = useState({});
            const [nombre, setNombre] = useState('');
            const [email, setEmail] = useState('');
            const [sending, setSending] = useState(false);
            const [submitted, setSubmitted] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);

            // REEMPLAZA ESTA URL CON LA TUYA DE GOOGLE SCRIPT
            const scriptURL = 'https://script.google.com/macros/s/AKfycbyTdQtXsDwOYin27Y-qc-9dP-OXJDHv9vx2qPLdiiyHgAVZPmvnjsZ9BHOyTV3fCh8H/exec';

            // FUNCIÓN MAESTRA PARA SUBIR AL INICIO
            const goToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [currentStep, submitted]);

            // Preguntas (Mantenemos tu lógica de 40 preguntas divididas en 8 bloques)
            const questions = useMemo(() => [
                { id: 1, cat:"Mentalidad", q:"¿Qué tanto te incomoda tu situación actual (1-10)?", opts: [{ t:"1-3: Cómodo", s: 1}, { t: "4-6: Podría mejorar", s: 4}, { t:"7-8: Cambio urgente", s:7 },{ t:"9-10: Innegociable", s:10 }]},
                { id: 2, cat:"Resiliencia", q:"¿Ajustas la estrategia si no hay resultados?", opts:[ { t:"Abandono", s:1 },{ t:"Dudo", s:4 }, { t:"Ajusto", s:7 },{ t:"Persisto", s:10 }]},
                { id: 3, cat:"Compromiso", q:"¿Qué lugar ocupa este avance hoy?", opts: [ { t:"Hobby", s:2 },{ t:"Ocasional", s:5 }, { t:"Secundario", s:8 },{ t:"Prioridad Total", s: 10}]},
                { id: 4, cat:"Estrategia", q:"¿Ves obstáculos como errores o como datos?", opts: [ { t:"Errores", s:2 },{ t:"Frustración", s:4 }, { t:"Inseguridad", s:7 },{ t:"Datos puros", s:10 }]},
                { id: 5, cat:"Sostenibilidad", q:"¿Tiempo dispuesto a invertir antes del retorno?", opts: [ { t:"15 días", s:1 },{ t:"2 meses", s:4 }, { t:"6 meses", s:7 },{ t:"Indefinido", s: 10}]},
                // ... (Copia aquí el resto de tus 40 preguntas completas)
            ], []);

            const nextStep = () => {
                setCurrentStep(s => s + 1);
                goToTop(); // <--- Aquí forzamos la subida
            };

            const prevStep = () => {
                setCurrentStep(s => s - 1);
                goToTop(); // <--- Aquí también
            };

            const handleSubmit = async () => {
                if (!nombre.trim() || !email.trim()) return;
                setSending(true);

                const resumen = Object.keys(answers).map(id => `P${id}:${answers[id]}`).join(" | ");
                const data = { nombre, email, fecha: new Date().toLocaleString(), resultado: resumen };

                try {
                    // Envío en segundo plano
                    fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                    
                    // Cambio visual inmediato
                    setSubmitted(true);
                    setTimeout(goToTop, 100); // <--- Subida final crítica
                } catch (e) { console.error(e); }
            };

            // VISTA DE CONFIRMACIÓN FINAL
            if (submitted) {
                return (
                    <div className="min-h-screen bg-black text-white p-6 md:p-20 flex flex-col items-center animate-in">
                        <div className="max-w-4xl w-full text-center space-y-12">
                            <header>
                                <h1 className="text-6xl md:text-9xl font-black italic tracking-tighter leading-none mb-4">
                                    <span className="block text-white">FÓRMULA.</span>
                                    <span className="block text-yellow-500 -mt-4">MOMENTUM</span>
                                </h1>
                                <div className="h-2 bg-yellow-500 w-32 mx-auto"></div>
                            </header>

                            <section className="p-8 md:p-16 rounded-[50px] neu-card border-yellow-500/20 text-left">
                                <h2 className="text-3xl md:text-5xl font-bold text-white uppercase italic text-center mb-12">
                                    Tus resultados fueron <span className="text-yellow-500">enviados correctamente.</span>
                                </h2>

                                <div className="space-y-8 text-slate-300 text-lg md:text-xl leading-relaxed">
                                    <p>Completar este formulario no garantiza nada.</p>
                                    <p>Solo marca el punto en el que algunas personas deciden dejar de improvisar y empezar a construir con <span className="text-white font-bold italic">criterio</span>.</p>
                                    <p>Los resultados consistentes no aparecen por motivación ni por promesas atractivas.</p>

                                    <div className="bg-yellow-500/10 p-8 rounded-3xl border border-yellow-500/20">
                                        <p className="text-white">
                                            Se desarrollan cuando hay una <span className="text-yellow-500 font-black tracking-widest">ESTRUCTURA</span>, un <span className="text-yellow-500 font-black tracking-widest">PROCESO</span> claro y acciones que pueden <span className="text-white font-bold underline">MEDIRSE</span> y <span className="text-white font-bold underline">COMPROBARSE</span> en el tiempo.
                                        </p>
                                    </div>

                                    <p>En breve vas a recibir un email con el <span className="text-white font-black px-2 bg-white/10">ESTADO y NIVEL DE APROBACIÓN</span> de tu solicitud.</p>
                                    <p>Si cumplís con los requisitos, vas a poder acceder a un proyecto diseñado para trabajar sobre esa base: método, ejecución y lectura constante de resultados.</p>
                                    <p className="text-white font-bold text-2xl italic">Acá el avance depende de <span className="text-yellow-500">DECISIÓN, VOLUNTAD y RESILIENCIA.</span></p>

                                    <p className="text-slate-500 italic pt-10 border-t border-white/5">
                                        Por eso son pocos los que llegan lejos: sostener el proceso cuando deja de ser cómodo es lo que separa a los que avanzan de los que se quedan en intención.
                                    </p>
                                </div>

                                <div className="mt-20 pt-10 border-t border-yellow-500/30 text-center">
                                    <h3 className="text-4xl md:text-6xl font-black italic text-white flex flex-col gap-2 leading-none">
                                        <span>LOS RESULTADOS EXTRAORDINARIOS</span>
                                        <span className="text-yellow-500">SE CONSTRUYEN,</span>
                                        <span className="text-white">NO SE ESPERAN.</span>
                                    </h3>
                                </div>
                            </section>
                        </div>
                    </div>
                );
            }

            // VISTA DEL FORMULARIO
            return (
                <div className="min-h-screen bg-black text-white p-6 md:p-12 font-sans">
                    <div className="max-w-4xl mx-auto">
                        <header className="text-center mb-16">
                            <h1 className="text-5xl md:text-7xl font-black italic tracking-tighter">
                                <span className="text-white">FÓRMULA.</span>
                                <span className="text-yellow-500">MOMENTUM</span>
                            </h1>
                        </header>

                        <div className="space-y-8 animate-in">
                            {questions.slice(currentStep * 5, (currentStep + 1) * 5).map(q => (
                                <div key={q.id} className="p-8 md:p-10 rounded-[40px] neu-card">
                                    <p className="text-yellow-500 text-[10px] font-black tracking-widest uppercase mb-2">{q.cat}</p>
                                    <h3 className="text-xl md:text-2xl font-bold mb-8 leading-tight">{q.q}</h3>
                                    <div className="grid gap-4">
                                        {q.opts.map((o, i) => (
                                            <button key={i} onClick={() => setAnswers({...answers, [q.id]: o.s})} className={`p-6 rounded-2xl text-left border transition-all ${answers[q.id] === o.s ? 'bg-yellow-500 text-black border-yellow-500 font-bold scale-[1.02]' : 'bg-transparent border-white/10 text-slate-400 hover:border-white/30'}`}>
                                                {o.t}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {currentStep === 7 && (
                            <div className="mt-12 p-8 md:p-16 rounded-[50px] neu-card border-yellow-500/20 text-center space-y-8 animate-in">
                                <h3 className="text-3xl font-black italic uppercase">Confirmación Final</h3>
                                <div className="grid gap-4">
                                    <input type="text" placeholder="Nombre completo" value={nombre} onChange={e => setNombre(e.target.value)} className="w-full p-6 rounded-2xl bg-[#050505] border border-white/10 outline-none focus:border-yellow-500 transition-all text-white font-bold" />
                                    <input type="email" placeholder="Email principal" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-6 rounded-2xl bg-[#050505] border border-white/10 outline-none focus:border-yellow-500 transition-all text-white font-bold" />
                                </div>
                                <button onClick={handleSubmit} disabled={sending || !nombre || !email} className="w-full p-8 rounded-3xl bg-yellow-500 text-black font-black text-2xl uppercase italic shadow-[0_0_30px_rgba(234,179,8,0.2)] hover:scale-[1.03] active:scale-95 transition-all">
                                    {sending ? 'ENVIANDO...' : 'ENVIAR EVALUACIÓN'}
                                </button>
                            </div>
                        )}

                        <div className="flex justify-between items-center mt-12 mb-20">
                            <button onClick={prevStep} disabled={currentStep === 0} className={`px-10 py-5 rounded-2xl font-black uppercase text-xs tracking-widest transition-all ${currentStep === 0 ? 'opacity-0' : 'neu-card text-slate-400 hover:text-white'}`}>Atrás</button>
                            <div className="text-xs font-black text-slate-700 tracking-[0.3em]">BLOQUE {currentStep + 1} / 8</div>
                            {currentStep < 7 ? (
                                <button onClick={nextStep} className="px-10 py-5 rounded-2xl bg-white text-black font-black uppercase text-xs tracking-widest hover:bg-yellow-500 transition-colors">Siguiente</button>
                            ) : <div className="w-32"></div>}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
