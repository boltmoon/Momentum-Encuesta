<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula Momentum - Evaluación de Criterio</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: black; color: white; margin: 0; font-family: 'Inter', sans-serif; scroll-behavior: auto !important; }
        .neu-card { background: #0a0a0a; border: 1px solid #1a1a1a; box-shadow: 10px 10px 20px #050505, -10px -10px 20px #0f0f0f; }
        .animate-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [currentStep, setCurrentStep] = useState(0);
            const [answers, setAnswers] = useState({});
            const [nombre, setNombre] = useState('');
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [sending, setSending] = useState(false);

            const scriptURL = 'TU_URL_DE_GOOGLE_SCRIPT_AQUÍ';

            const forceScrollTop = () => {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
            };

            const allQuestions = [
                // (Mantener aquí tus 40 preguntas con el formato {id, cat, q, opts:[{t, s}]})
                { id: 1, cat:"Mentalidad", q:"¿Qué tanto te incomoda tu situación actual (1-10)?", opts: [{ t:"1-3: Cómodo", s: 1}, { t: "4-6: Podría mejorar", s: 4}, { t:"7-8: Necesito un cambio", s:7 },{ t:"9-10: Innegociable", s:10 }]},
                { id: 2, cat:"Resiliencia", q:"¿Ajustas la estrategia si no hay resultados?", opts:[ { t:"Abandono", s:1 },{ t:"Cuestiono", s:4 }, { t:"Ajusto", s:7 },{ t:"Persisto", s:10 }]},
                { id: 3, cat:"Compromiso", q:"¿Qué prioridad tiene este avance hoy?", opts: [ { t:"Pasatiempo", s:2 },{ t:"Si hay tiempo", s:5 }, { t:"Secundaria", s:8 },{ t:"Eje central", s: 10}]},
                // ... agrega el resto siguiendo este patrón exacto
            ];

            const handleNext = () => {
                setCurrentStep(prev => prev + 1);
                setTimeout(forceScrollTop, 50);
            };

            const handleBack = () => {
                setCurrentStep(prev => prev - 1);
                setTimeout(forceScrollTop, 50);
            };

            const handleSubmit = async () => {
                if (!nombre || !email) return;
                setSending(true);
                const resumen = Object.keys(answers).map(id => `P${id}:${answers[id]}`).join(" | ");
                const data = { nombre, email, fecha: new Date().toLocaleString(), resultado: resumen };

                try {
                    await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                    setSubmitted(true);
                    setTimeout(forceScrollTop, 100);
                } catch (e) { console.error(e); }
            };

            // PANTALLA DE ÉXITO CON TUS TEXTOS MOTIVADORES
            if (submitted) {
                return (
                    <div className="min-h-screen bg-black text-white p-6 flex flex-col items-center animate-in">
                        <header className="text-center mb-10">
                             <h1 className="text-6xl md:text-9xl font-black italic tracking-tighter leading-none">
                                <span className="block text-white">FÓRMULA.</span>
                                <span className="block text-yellow-500 -mt-4">MOMENTUM</span>
                            </h1>
                        </header>

                        <div className="max-w-4xl w-full p-10 rounded-[40px] neu-card border border-yellow-500/30 space-y-8">
                            <h2 className="text-2xl md:text-4xl font-bold text-center text-yellow-500 italic uppercase">
                                Tus resultados fueron enviados correctamente.
                            </h2>
                            
                            <div className="space-y-6 text-slate-300 text-lg md:text-xl leading-relaxed">
                                <p>Completar este formulario no garantiza nada.</p>
                                <p>Solo marca el punto en el que algunas personas deciden dejar de improvisar y empezar a construir con <span className="text-white font-bold italic">criterio</span>.</p>
                                
                                <div className="bg-yellow-500/10 p-8 rounded-3xl border border-yellow-500/20 text-white italic">
                                    "Se desarrollan cuando hay una <span className="text-yellow-500 font-bold">ESTRUCTURA</span>, un <span className="text-yellow-500 font-bold">PROCESO</span> claro y acciones que pueden medirse y comprobarse en el tiempo."
                                </div>

                                <p>En breve vas a recibir un email con el <span className="text-white font-bold uppercase">Estado y Nivel de Aprobación</span> de tu solicitud.</p>
                                
                                <div className="pt-10 border-t border-white/10 text-center">
                                    <h3 className="text-3xl md:text-5xl font-black italic text-white flex flex-col gap-2">
                                        <span>LOS RESULTADOS EXTRAORDINARIOS</span>
                                        <span className="text-yellow-500 underline decoration-yellow-500 decoration-4">SE CONSTRUYEN,</span>
                                        <span>NO SE ESPERAN.</span>
                                    </h3>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const questionsToShow = allQuestions.slice(currentStep * 5, (currentStep + 1) * 5);

            return (
                <div className="min-h-screen bg-black text-white p-6 md:p-12">
                    <div className="max-w-4xl mx-auto">
                        <header className="text-center mb-12">
                            <h1 className="text-6xl md:text-8xl font-black italic tracking-tighter">
                                <span className="text-white">FÓRMULA.</span>
                                <span className="text-yellow-500">MOMENTUM</span>
                            </h1>
                            <div className="mt-6 p-6 rounded-3xl neu-card text-slate-300 italic text-lg md:text-xl border-l-4 border-yellow-500">
                                Esta evaluación honesta te permitirá ubicarte con claridad y entender si tienes lo necesario para escalar.
                            </div>
                        </header>

                        <div className="space-y-8 animate-in">
                            {questionsToShow.map(q => (
                                <div key={q.id} className="p-8 md:p-10 rounded-[40px] neu-card transition-all hover:border-yellow-500/20">
                                    <span className="text-yellow-500 text-[10px] font-black uppercase tracking-[0.3em]">{q.cat}</span>
                                    <h3 className="text-xl md:text-2xl font-bold mt-2 mb-8 leading-tight">{q.q}</h3>
                                    <div className="grid gap-4">
                                        {q.opts.map((o, i) => (
                                            <button key={i} 
                                                onClick={() => setAnswers({...answers, [q.id]: o.s})}
                                                className={`p-6 rounded-2xl text-left border transition-all ${answers[q.id] === o.s ? 'bg-yellow-500 text-black border-yellow-500 font-bold scale-[1.02]' : 'bg-transparent border-white/10 text-slate-400 hover:border-white/30'}`}
                                            >
                                                {o.t}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {currentStep === 7 && (
                            <div className="mt-12 p-8 md:p-12 rounded-[50px] neu-card border border-yellow-500/30 text-center space-y-6">
                                <h3 className="text-3xl font-black italic">SOLICITAR ANÁLISIS</h3>
                                <div className="space-y-4">
                                    <input type="text" placeholder="Nombre completo" value={nombre} onChange={e => setNombre(e.target.value)} className="w-full p-6 rounded-2xl bg-black border border-white/10 text-white outline-none focus:border-yellow-500 font-bold" />
                                    <input type="email" placeholder="Email principal" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-6 rounded-2xl bg-black border border-white/10 text-white outline-none focus:border-yellow-500 font-bold" />
                                </div>
                                <button onClick={handleSubmit} disabled={sending || !nombre || !email} className="w-full p-8 rounded-3xl bg-yellow-500 text-black font-black text-2xl uppercase italic shadow-lg shadow-yellow-500/20 active:scale-95 transition-all">
                                    {sending ? 'TRANSMITIENDO...' : 'ENVIAR EVALUACIÓN'}
                                </button>
                            </div>
                        )}

                        <div className="flex justify-between items-center mt-12 mb-20">
                            <button onClick={handleBack} disabled={currentStep === 0} className={`px-10 py-5 rounded-2xl font-black uppercase text-xs tracking-widest ${currentStep === 0 ? 'invisible' : 'neu-card text-slate-400 hover:text-white'}`}>Atrás</button>
                            <span className="text-[10px] font-black text-slate-600 uppercase tracking-widest">Bloque {currentStep + 1} de 8</span>
                            {currentStep < 7 && (
                                <button onClick={handleNext} className="px-10 py-5 rounded-2xl bg-white text-black font-black uppercase text-xs hover:bg-yellow-500 transition-all">Siguiente</button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
