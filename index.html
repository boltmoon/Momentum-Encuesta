<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula Momentum - Evaluación</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.6s ease-out forwards; }
        body { background-color: black; margin: 0; color: white; overflow-x: hidden; }
        .neu-card { background: #0a0a0a; border: 1px solid #1a1a1a; box-shadow: 10px 10px 20px #050505, -10px -10px 20px #0f0f0f; }
        .text-yellow { color: #eab308; }
        .bg-yellow { background-color: #eab308; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            const [answers, setAnswers] = useState({});
            const [nombre, setNombre] = useState('');
            const [email, setEmail] = useState('');
            const [sending, setSending] = useState(false);
            const [submitted, setSubmitted] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);

            const scriptURL = 'TU_URL_DE_GOOGLE_SCRIPT'; // REEMPLAZA CON TU URL

            // Función para subir al inicio siempre
            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [currentStep, submitted]);

            // Lógica de preguntas (Sigue igual)
            const questions = useMemo(() => [
                { id: 1, cat:"Mentalidad", q:"¿Qué tanto te incomoda tu situación actual (1-10)?", opts: [{ t:"1-3: Cómodo", s: 1}, { t: "4-6: Podría mejorar", s: 4}, { t:"7-8: Cambio urgente", s:7 },{ t:"9-10: Innegociable", s:10 }]},
                { id: 2, cat:"Resiliencia", q:"¿Ajustas la estrategia si no hay resultados?", opts:[ { t:"Abandono", s:1 },{ t:"Dudo", s:4 }, { t:"Ajusto", s:7 },{ t:"Persisto", s:10 }]},
                { id: 3, cat:"Compromiso", q:"¿Qué lugar ocupa este avance hoy?", opts: [ { t:"Hobby", s:2 },{ t:"Ocasional", s:5 }, { t:"Secundario", s:8 },{ t:"Prioridad Total", s: 10}]},
                // ... (Añade aquí el resto de tus preguntas de la misma forma)
            ], []);

            const handleNext = () => {
                setCurrentStep(s => s + 1);
                scrollToTop(); // Sube al inicio al cambiar bloque
            };

            const handleBack = () => {
                setCurrentStep(s => s - 1);
                scrollToTop();
            };

            const handleSubmit = async () => {
                if (!nombre.trim() || !email.trim()) return;
                setSending(true);

                const resumen = Object.keys(answers).map(id => `P${id}:${answers[id]}`).join(" | ");
                const data = { nombre, email, fecha: new Date().toLocaleString(), resultado: resumen };

                try {
                    // Enviamos sin esperar respuesta pesada para no bloquear
                    fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                    
                    setSubmitted(true);
                    setTimeout(scrollToTop, 100); // Sube al inicio para ver el mensaje
                } catch (e) { console.error(e); }
                setSending(false);
            };

            // VISTA DE AGRADECIMIENTO Y CONFIRMACIÓN
            if (submitted) {
                return (
                    <div className="min-h-screen bg-black flex flex-col items-center p-6 md:p-20 animate-fade">
                        <div className="max-w-4xl w-full text-center space-y-12">
                            
                            {/* LOGO EN GRANDE */}
                            <div className="mb-10">
                                <h1 className="text-6xl md:text-9xl font-black italic tracking-tighter leading-none">
                                    <span className="text-white block">FÓRMULA.</span>
                                    <span className="text-yellow block -mt-4">MOMENTUM</span>
                                </h1>
                                <div className="h-2 bg-yellow w-32 mx-auto mt-4"></div>
                            </div>

                            <div className="p-8 md:p-16 rounded-[40px] neu-card border-yellow/20">
                                <h2 className="text-2xl md:text-4xl font-bold text-white uppercase italic mb-8">
                                    Tus resultados fueron <span className="text-yellow">enviados correctamente.</span>
                                </h2>

                                <div className="space-y-6 text-slate-300 text-lg md:text-xl leading-relaxed text-left border-l-2 border-yellow/30 pl-6">
                                    <p>Completar este formulario no garantiza nada.</p>
                                    <p>Solo marca el punto en el que algunas personas deciden dejar de improvisar y empezar a construir con <span className="text-white font-bold italic">criterio</span>.</p>
                                    <p>Los resultados consistentes no aparecen por motivación ni por promesas atractivas.</p>
                                    
                                    <div className="bg-yellow/10 p-6 rounded-2xl border border-yellow/20 my-6">
                                        <p className="text-white">
                                            Se desarrollan cuando hay una <span className="text-yellow font-black">ESTRUCTURA</span>, un <span className="text-yellow font-black">PROCESO</span> claro y acciones que pueden <span className="font-bold underline">MEDIRSE</span> y <span className="font-bold underline">COMPROBARSE</span> en el tiempo.
                                        </p>
                                    </div>

                                    <p>En breve vas a recibir un email con el <span className="text-white font-black">ESTADO y NIVEL DE APROBACIÓN</span> de tu solicitud.</p>
                                    <p>Si cumplís con los requisitos, vas a poder acceder a un proyecto diseñado para trabajar sobre esa base: método, ejecución y lectura constante de resultados.</p>
                                    <p className="text-white font-bold italic">Acá el avance depende de <span className="text-yellow">DECISIÓN, VOLUNTAD y RESILIENCIA</span>.</p>
                                    
                                    <p className="text-sm text-slate-500 pt-6 border-t border-white/10">
                                        Por eso son pocos los que llegan lejos: sostener el proceso cuando deja de ser cómodo es lo que separa a los que avanzan de los que se quedan en intención.
                                    </p>
                                </div>

                                <div className="mt-16 pt-10 border-t border-yellow/20">
                                    <p className="text-xs tracking-[0.4em] text-slate-500 mb-4">Aceptas una verdad simple:</p>
                                    <h3 className="text-4xl md:text-6xl font-black italic text-white flex flex-col">
                                        <span>LOS RESULTADOS EXTRAORDINARIOS</span>
                                        <span className="text-yellow">SE CONSTRUYEN,</span>
                                        <span>NO SE ESPERAN.</span>
                                    </h3>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // VISTA DEL CUESTIONARIO
            return (
                <div className="min-h-screen bg-black text-white p-6 md:p-12 font-sans">
                    <div className="max-w-4xl mx-auto">
                        <header className="text-center mb-16">
                            <h1 className="text-5xl md:text-7xl font-black italic tracking-tighter">
                                <span className="text-white">FÓRMULA.</span>
                                <span className="text-yellow">MOMENTUM</span>
                            </h1>
                        </header>

                        <div className="space-y-8 mb-12">
                            {questions.slice(currentStep * 5, (currentStep + 1) * 5).map(q => (
                                <div key={q.id} className="p-8 rounded-[30px] neu-card animate-fade">
                                    <p className="text-yellow text-[10px] font-black tracking-widest uppercase mb-2">{q.cat}</p>
                                    <h3 className="text-xl md:text-2xl font-bold mb-6 leading-tight">{q.q}</h3>
                                    <div className="grid gap-3">
                                        {q.opts.map((o, i) => (
                                            <button key={i} onClick={() => setAnswers({...answers, [q.id]: o.s})} className={`p-5 rounded-2xl text-left border transition-all ${answers[q.id] === o.s ? 'bg-yellow text-black border-yellow font-bold' : 'bg-transparent border-white/10 text-slate-400 hover:border-white/30'}`}>
                                                {o.t}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {currentStep === 7 && (
                            <div className="p-8 md:p-12 rounded-[40px] neu-card border-yellow/20 text-center space-y-6">
                                <h3 className="text-2xl font-black italic uppercase">Último paso</h3>
                                <input type="text" placeholder="Tu Nombre Completo" value={nombre} onChange={e => setNombre(e.target.value)} className="w-full p-5 rounded-2xl bg-black border border-white/10 outline-none focus:border-yellow transition-all" />
                                <input type="email" placeholder="Tu Email Principal" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-5 rounded-2xl bg-black border border-white/10 outline-none focus:border-yellow transition-all" />
                                <button onClick={handleSubmit} disabled={sending || !nombre || !email} className="w-full p-8 rounded-3xl bg-yellow text-black font-black text-2xl uppercase italic shadow-[0_0_30px_rgba(234,179,8,0.2)] hover:scale-[1.02] active:scale-95 transition-all">
                                    {sending ? 'TRANSMITIENDO...' : 'ENVIAR EVALUACIÓN'}
                                </button>
                            </div>
                        )}

                        <div className="flex justify-between items-center mt-12 mb-20">
                            <button onClick={handleBack} disabled={currentStep === 0} className={`px-8 py-4 rounded-xl font-black uppercase text-xs tracking-widest ${currentStep === 0 ? 'opacity-0' : 'neu-card text-slate-400'}`}>Atrás</button>
                            <div className="flex gap-2 text-[10px] font-bold text-slate-600">BLOQUE {currentStep + 1} DE 8</div>
                            {currentStep < 7 ? (
                                <button onClick={handleNext} className="px-8 py-4 rounded-xl bg-white text-black font-black uppercase text-xs tracking-widest">Siguiente</button>
                            ) : <div className="w-24"></div>}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
