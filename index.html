<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FÓRMULA MOMENTUM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: white;
            margin: 0;
        }

        .text-gris { color: #888888; }
        .text-blanco { color: #ffffff; }
        .text-amarillo-digital { color: #FACC15; } /* Amarillo digital intenso */

        .recuadro-diagnostico {
            background-color: #111111;
            border: 1px solid #FACC15;
            border-radius: 20px;
            padding: 2rem;
            margin-top: 3rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-text {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useMemo } = React;

        const TextFormatter = ({ text }) => {
            // Función para procesar el texto y aplicar estilos palabra por palabra
            const formattedWords = useMemo(() => {
                return text.split(/(\s+)/).map((part, index) => {
                    if (/\s+/.test(part)) return part; // Mantener espacios

                    const cleanWord = part.replace(/[.,:;()]/g, '').toUpperCase();
                    const isSpecial = cleanWord === "PROFESIONALES" || cleanWord === "EMPRENDEDORES";
                    
                    // Lógica de color:
                    // 1. Si es Profesional/Emprendedor -> Amarillo
                    // 2. Si la palabra original contiene mayúsculas -> Blanco
                    // 3. Si la palabra original es todo minúsculas -> Gris
                    
                    let className = "text-gris";
                    if (isSpecial) {
                        className = "text-amarillo-digital font-black italic";
                    } else if (/[A-Z]/.test(part)) {
                        className = "text-blanco font-bold";
                    }

                    return <span key={index} className={className}>{part}</span>;
                });
            }, [text]);

            return <span>{formattedWords}</span>;
        };

        const App = () => {
            return (
                <div className="min-h-screen bg-black text-white p-6 md:p-20 flex flex-col items-center">
                    <div className="max-w-4xl w-full">
                        
                        {/* LOGO SECCIÓN */}
                        <header className="mb-16 text-center md:text-left">
                            <h1 className="text-6xl md:text-8xl font-black tracking-tighter uppercase italic leading-none flex flex-col">
                                <span className="text-white">FÓRMULA</span>
                                <span className="text-amarillo-digital">MOMENTUM</span>
                            </h1>
                        </header>

                        {/* CUERPO DE TEXTO PRINCIPAL */}
                        <div className="space-y-8 text-lg md:text-xl leading-relaxed animate-text">
                            
                            <p>
                                <TextFormatter text="La FÓRMULA MOMENTUM nace de una manera específica de entender cómo se construyen los resultados." />
                            </p>

                            <p>
                                <TextFormatter text="Está diseñada exclusivamente para PROFESIONALES y EMPRENDEDORES que comprenden que avanzar no depende de impulsos aislados, sino de sostener decisiones en el tiempo." />
                            </p>

                            <p>
                                <TextFormatter text="Personas con HAMBRE POR AVANZAR, RESILIENCIA FRENTE A LOS OBSTÁCULOS y COMPROMISO REAL PARA LLEVAR UN PROCESO HASTA EL FINAL." />
                            </p>

                            <p>
                                <TextFormatter text="Acá no se improvisa ni se persiguen efectos inmediatos." />
                            </p>

                            <p>
                                <TextFormatter text="El avance se da cuando cada acción responde a un enfoque claro, una secuencia ordenada y una revisión constante que transforma la experiencia en mejora concreta." />
                            </p>

                            <p>
                                <TextFormatter text="El único riesgo en este tipo de procesos no es equivocarse ni avanzar más lento de lo esperado — es INTERRUMPIR EL RECORRIDO antes de comprender cómo se conectan las decisiones con los resultados." />
                            </p>

                            <p>
                                <TextFormatter text="Cuando esa comprensión aparece, los resultados dejan de ser circunstanciales. Se vuelven PREVISIBLES, SOSTENIBLES y directamente dependientes del criterio de quien ejecuta." />
                            </p>

                            {/* RECUADRO DE DIAGNÓSTICO */}
                            <div className="recuadro-diagnostico">
                                <div className="space-y-6">
                                    <p>
                                        <TextFormatter text="Esto no es una promesa ni una inscripción automática. Es una instancia de diagnóstico real, pensada para observar cómo tomás decisiones, cómo ejecutás y cómo sostenés un proceso cuando no hay atajos." />
                                    </p>
                                    <p>
                                        <TextFormatter text="No busca validar ni descartar personas; expone con claridad si estás dispuesto a hacer lo que el proceso exige, con consistencia, responsabilidad y sin relatos mágicos." />
                                    </p>
                                </div>
                            </div>
                        </div>

                        <footer className="mt-20 text-center">
                            <button className="px-10 py-5 bg-white text-black font-black italic rounded-full hover:bg-yellow-400 transition-colors uppercase tracking-widest text-sm">
                                Comenzar Evaluación
                            </button>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
