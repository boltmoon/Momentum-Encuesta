<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula Momentum - Evaluación</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000 !important; margin: 0; color: white; scroll-behavior: auto !important; }
        .neu-card { background: #0a0a0a; border: 1px solid #1a1a1a; box-shadow: 10px 10px 20px #050505, -10px -10px 20px #0f0f0f; }
        .text-yellow { color: #eab308; }
        .bg-yellow { background-color: #eab308; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            const [answers, setAnswers] = useState({});
            const [nombre, setNombre] = useState('');
            const [email, setEmail] = useState('');
            const [sending, setSending] = useState(false);
            const [submitted, setSubmitted] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);

            const scriptURL = 'TU_URL_DE_GOOGLE_SCRIPT'; 

            // FORZAR SUBIDA AL INICIO - MODO REFORZADO
            const forceScrollUp = () => {
                window.scrollTo(0, 0);
                document.body.scrollTop = 0; 
                document.documentElement.scrollTop = 0;
            };

            const handleNext = () => {
                setCurrentStep(prev => prev + 1);
                setTimeout(forceScrollUp, 50); // Pequeño retraso para asegurar que React ya cambió el contenido
            };

            const handleBack = () => {
                setCurrentStep(prev => prev - 1);
                setTimeout(forceScrollUp, 50);
            };

            const handleSubmit = async () => {
                if (!nombre.trim() || !email.trim()) return;
                setSending(true);
                const resumen = Object.keys(answers).map(id => `P${id}:${answers[id]}`).join(" | ");
                const data = { nombre, email, fecha: new Date().toLocaleString(), resultado: resumen };

                try {
                    fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                    setSubmitted(true);
                    // IMPORTANTE: Subimos inmediatamente al confirmar
                    setTimeout(forceScrollUp, 100);
                } catch (e) { console.error(e); }
                setSending(false);
            };

            if (submitted) {
                return (
                    <div className="min-h-screen bg-black flex flex-col items-center p-6 md:p-20 text-white border-t-4 border-yellow-500">
                        <div className="max-w-4xl w-full text-center">
                            <h1 className="text-6xl md:text-9xl font-black italic tracking-tighter leading-none mb-10">
                                <span className="block">FÓRMULA.</span>
                                <span className="text-yellow-500 block -mt-4">MOMENTUM</span>
                            </h1>
                            <div className="p-8 md:p-16 rounded-[40px] neu-card border border-yellow-500/30 text-left space-y-8">
                                <h2 className="text-2xl md:text-4xl font-bold text-center uppercase italic underline decoration-yellow-500 decoration-4">
                                    ¡EVALUACIÓN ENVIADA CON ÉXITO!
                                </h2>
                                <div className="space-y-6 text-slate-300 text-lg md:text-xl">
                                    <p>Tus datos han sido registrados en nuestro sistema de alto rendimiento.</p>
                                    <p>En breve recibirás un email con el <span className="text-white font-bold">ESTADO y NIVEL DE APROBACIÓN</span> de tu solicitud.</p>
                                    <div className="bg-yellow-500/10 p-6 rounded-2xl border border-yellow-500/20 text-white font-bold italic">
                                        "Los resultados extraordinarios se construyen, no se esperan."
                                    </div>
                                    <p className="text-sm text-slate-500 italic">Revisa tu bandeja de entrada (y la carpeta de spam por si acaso).</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-black text-white p-6 md:p-12">
                    <div className="max-w-4xl mx-auto">
                        <header className="text-center mb-10">
                            <h1 className="text-5xl md:text-7xl font-black italic tracking-tighter">FÓRMULA.<span className="text-yellow-500">MOMENTUM</span></h1>
                        </header>

                        <div className="space-y-6">
                            {/* Simulamos bloques de 5 preguntas */}
                            <div className="p-8 rounded-[30px] neu-card">
                                <h3 className="text-xl font-bold mb-6 text-yellow-500">BLOQUE {currentStep + 1} DE 8</h3>
                                <p className="text-slate-400 italic">Responde todas las preguntas para avanzar.</p>
                            </div>
                            
                            {/* Aquí van tus preguntas (mantén el código que ya tenías de las preguntas) */}
                            {/* ... (Tu código de mapeo de preguntas aquí) ... */}
                        </div>

                        {currentStep === 7 && (
                            <div className="mt-8 p-8 rounded-[40px] neu-card border border-yellow-500/20 text-center space-y-4">
                                <input type="text" placeholder="Tu Nombre" value={nombre} onChange={e => setNombre(e.target.value)} className="w-full p-4 rounded-xl bg-black border border-white/20 text-white" />
                                <input type="email" placeholder="Tu Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-4 rounded-xl bg-black border border-white/20 text-white" />
                                <button onClick={handleSubmit} className="w-full p-6 bg-yellow-500 text-black font-black text-xl uppercase italic rounded-2xl">ENVIAR AHORA</button>
                            </div>
                        )}

                        <div className="flex justify-between mt-10 mb-20">
                            <button onClick={handleBack} disabled={currentStep === 0} className="px-6 py-3 rounded-xl neu-card disabled:opacity-0">ATRÁS</button>
                            {currentStep < 7 && <button onClick={handleNext} className="px-8 py-4 bg-white text-black font-black rounded-xl">SIGUIENTE BLOQUE</button>}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
