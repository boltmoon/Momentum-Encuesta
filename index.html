<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Fórmula Momentum – Evaluación Estratégica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #e5e7eb;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }
    h1, h2, h3 {
      color: #facc15;
      text-transform: uppercase;
    }
    .card {
      background: #000;
      border: 1px solid #222;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .option {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid #222;
      margin-top: 12px;
      cursor: pointer;
      transition: all .2s ease;
    }
    .option:hover {
      border-color: #facc15;
    }
    .option.selected {
      background: #facc15;
      color: #000;
      font-weight: bold;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
    }
    button {
      padding: 14px 24px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button.primary {
      background: #facc15;
      color: #000;
    }
    button.secondary {
      background: #111;
      color: #888;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid #222;
      background: #000;
      color: #fff;
      margin-top: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Fórmula Momentum</h1>
    <p>
      Esta evaluación no está pensada para curiosos.
      Busca ubicarte con claridad respecto a tu nivel de compromiso,
      resiliencia y criterio profesional.
    </p>

    <div id="quiz"></div>

    <div class="nav">
      <button class="secondary" onclick="prevStep()">Regresar</button>
      <button class="primary" onclick="nextStep()">Continuar</button>
    </div>
  </div>

<script>
const questions = [
  {
    q: "¿Qué tan incómoda es tu situación actual?",
    opts: [
      "Estoy cómodo",
      "Podría mejorar",
      "Necesito cambiar pronto",
      "Es innegociable avanzar"
    ]
  },
  {
    q: "Cuando el proceso se complica, vos:",
    opts: [
      "Abandonás",
      "Dudás",
      "Seguís con fricción",
      "Ajustás y continuás"
    ]
  },
  {
    q: "Este proceso para vos es:",
    opts: [
      "Curiosidad",
      "Opcional",
      "Importante",
      "Prioridad absoluta"
    ]
  }
];

let step = 0;
let answers = {};

function render() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";

  if (step < questions.length) {
    const q = questions[step];
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `<h3>${q.q}</h3>`;

    q.opts.forEach((opt, i) => {
      const div = document.createElement("div");
      div.className = "option" + (answers[step] === i ? " selected" : "");
      div.innerText = opt;
      div.onclick = () => {
        answers[step] = i;
        render();
      };
      card.appendChild(div);
    });

    quiz.appendChild(card);
  } else {
    quiz.innerHTML = `
      <div class="card">
        <h2>Finalizar Evaluación</h2>
        <input id="nombre" placeholder="Nombre completo" />
        <input id="email" placeholder="Email" />
        <button class="primary" onclick="send()">Enviar evaluación</button>
      </div>
    `;
  }
}

function nextStep() {
  if (step < questions.length) step++;
  render();
}

function prevStep() {
  if (step > 0) step--;
  render();
}

function send() {
  const nombre = document.getElementById("nombre").value;
  const email = document.getElementById("email").value;

  if (!nombre || !email) {
    alert("Completá nombre y email");
    return;
  }

  alert("Evaluación enviada correctamente");
}

render();
</script>

</body>
</html>
